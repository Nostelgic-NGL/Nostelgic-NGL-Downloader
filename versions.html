<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Old Versions - Nostelgic NGL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .version-card {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            margin-bottom: 10px;
        }
        .version-info h4 { font-size: 15px; color: #f8fafc; font-weight: 700; margin-bottom: 4px; }
        .version-info p { font-size: 12px; color: #94a3b8; }
        .download-icon-btn {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(219,39,119,0.3);
        }
        .back-link {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }
        .back-link:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="download-container" style="max-width: 460px;">
        <!-- App Logo with Fast Loading Fix -->
        <img src="Nostelgic-NGL.png" alt="Nostelgic NGL Logo" class="app-logo" style="width: 70px; height: 70px; min-width: 70px; min-height: 70px; object-fit: contain; margin-bottom: 10px;">

        <div style="width: 100%; text-align: left;">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <h1 style="font-size: 24px; font-weight: 800; color: #f8fafc; margin-bottom: 6px;">Old Versions</h1>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Download previous releases of Nostelgic NGL.</p>
        </div>

        <div style="width: 100%; max-height: 50vh; overflow-y: auto; padding-right: 4px;">
            
            <!-- Version v1.0 Item -->
            <div class="version-card">
                <div class="version-info">
                    <h4>Nostelgic NGL v1.0</h4>
                    <p>Size: 7.30 MB • Oct 22, 2026</p>
                </div>
                <a href="https://github.com/Nostelgic-NGL/Nostelgic-NGL-Official/releases/download/Nostelgic-NGL/Nostelgic-NGL.apk" class="download-icon-btn" download>
                    <i class="fas fa-download"></i>
                </a>
            </div>

        </div>

        <div class="footer-info">
            Older builds may lack recent bug fixes.
        </div>
    </div>

</body>
</html>
