<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostelgic NGL - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .admin-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .admin-header { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 10px; }
        .admin-card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .admin-card h3 { font-size: 15px; color: #cbd5e1; }
        .stat-value { font-size: 32px; font-weight: 700; color: #ec4899; }
        .admin-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; }
        .admin-btn:active { transform: scale(0.98); }
        .hidden { display: none !important; }
        .login-box { display: flex; flex-direction: column; gap: 15px; max-width: 350px; width: 100%; background: #131b2e; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .login-input { background: #0b0f19; border: 1px solid #334155; padding: 14px; border-radius: 12px; color: white; outline: none; width: 100%; font-size: 14px; }
        .login-input:focus { border-color: #ec4899; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="adminLoginSection" class="login-box">
        <h2 style="text-align: center; font-size: 20px; color: #f8fafc;">Admin Login</h2>
        <input type="password" id="adminPasswordInput" class="login-input" placeholder="Enter Admin Password">
        <button id="adminLoginBtn" class="admin-btn">Login</button>
    </div>

    <!-- Dashboard Section -->
    <div id="adminDashboardSection" class="admin-container hidden">
        <h1 class="admin-header">Nostelgic NGL Admin</h1>
        
        <div class="admin-card">
            <h3>Total Registered Users</h3>
            <div class="stat-value" id="totalUsersCount">Loading...</div>
        </div>

        <div class="admin-card">
            <h3>Total Messages Sent</h3>
            <div class="stat-value" id="totalMessagesCount">Loading...</div>
        </div>

        <button id="adminLogoutBtn" class="admin-btn" style="background: #ef4444;">Logout</button>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
